name: Validate OSINT Monster Database

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Schema, Hunter, MCP & Active Authorization Gate Self-Tests
        run: python3 scripts/selftest.py
      - name: Verify Build Determinism
        run: |
          python3 scripts/build.py
          python3 scripts/osint.py stats
          git diff --exit-code README.md categories/ docs/ skills/ releases/ data/tools.csv data/tools.jsonl web/data.js
